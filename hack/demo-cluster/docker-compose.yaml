version: '3.8'

services:
  gateway:
    build:
      context: ../..
      dockerfile: hack/demo-cluster/gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - AUTH_URL=http://auth:8081
      - ORDERS_URL=http://orders:8082
      - ANALYTICS_URL=http://analytics:8085
    depends_on:
      - auth
      - orders
      - analytics
    networks:
      - mesh

  auth:
    build:
      context: ../..
      dockerfile: hack/demo-cluster/auth/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - AUTH_PORT=8081
      - AUTH_LATENCY_MS=10
    networks:
      - mesh

  orders:
    build:
      context: ../..
      dockerfile: hack/demo-cluster/orders/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - ORDERS_PORT=8082
      - ORDERS_LATENCY_MS=30
      - INVENTORY_URL=http://inventory:8083
      - PAYMENTS_URL=http://payments:8084
    depends_on:
      - inventory
      - payments
    networks:
      - mesh

  inventory:
    build:
      context: ../..
      dockerfile: hack/demo-cluster/inventory/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - INVENTORY_PORT=8083
      - INVENTORY_LATENCY_MS=20
    networks:
      - mesh

  payments:
    build:
      context: ../..
      dockerfile: hack/demo-cluster/payments/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - PAYMENTS_PORT=8084
      - PAYMENTS_LATENCY_MS=100
    networks:
      - mesh

  analytics:
    build:
      context: ../..
      dockerfile: hack/demo-cluster/analytics/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - ANALYTICS_PORT=8085
      - ANALYTICS_LATENCY_MS=50
    networks:
      - mesh

  cascadeshield:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    privileged: true
    pid: "host"
    network_mode: "host"
    volumes:
      - /sys/kernel/debug:/sys/kernel/debug
      - /sys/fs/bpf:/sys/fs/bpf
    environment:
      - LOG_LEVEL=info

networks:
  mesh:
    driver: bridge
