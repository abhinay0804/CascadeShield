apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cascadeshield-demo
  labels:
    app: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
      - name: gateway
        image: cascadeshield/gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: GATEWAY_PORT
          value: "8080"
        - name: AUTH_URL
          value: "http://auth:8081"
        - name: ORDERS_URL
          value: "http://orders:8082"
        - name: ANALYTICS_URL
          value: "http://analytics:8085"
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
---
apiVersion: apps/v1
