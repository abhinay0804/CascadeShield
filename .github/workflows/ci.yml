name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./pkg/... || true
      - name: Test
        run: go test ./pkg/... -v -count=1
      - name: Build check (non-eBPF packages)
        run: go build ./pkg/...
